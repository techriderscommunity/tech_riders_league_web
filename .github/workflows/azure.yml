name: Website CI and Azure deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test application and production HTTP contracts
        run: npm test
        env:
          LEAGUE_PRODUCTION_TEST: "true"
      - name: Package Linux production release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          npm prune --omit=dev
          npm run package:release
      - name: Verify packaged application starts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: dist/web
        run: |
          npm start -- --hostname 127.0.0.1 --port 3100 > ../release-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3100/eventos -o ../release-page.html &&
              grep -q 'Haz clic para explorar' ../release-page.html; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat ../release-start.log
            echo "::error::Packaged application did not start successfully."
            exit 1
          fi
      - name: Archive verified release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd dist/web
          zip -qr ../website.zip .
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: website-${{ github.sha }}
          path: dist/website.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: azure-test
      url: ${{ vars.AZURE_WEBAPP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: dist
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify existing Azure application
        run: bash scripts/deploy-azure.sh
